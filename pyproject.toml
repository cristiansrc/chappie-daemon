[project]
name = "chappie-daemon"
version = "1.0.0"
description = "Local voice assistant daemon for the Chappie ecosystem"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.0",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.0",
    "aiofiles>=25.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
pyaudio = ["pyaudio>=0.2.11"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
chappie-daemon = "app.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/infrastructure/adapters/input/schemas.py",
    "app/config.py",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
